syntax = "proto3";

package cline;

import "cline/common.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

// SlashService provides methods for managing slash commands
service SlashService {
  // Sends button click message
  rpc reportBug(StringRequest) returns (Empty);
  rpc condense(StringRequest) returns (Empty);

  // Hand a task to a configured agent, on the user's say-so rather than the
  // model's. Returns what the agent reported back.
  rpc delegate(DelegateRequest) returns (DelegateResponse);

  // The same, except it runs beside the current turn and the caller does not
  // wait. The agent's report reaches the conversation when the run finishes.
  rpc delegateBackground(DelegateRequest) returns (BackgroundDelegation);

  // The background delegations of the current session, for the panel.
  rpc listBackgroundDelegations(EmptyRequest) returns (BackgroundDelegationList);

  // Pause, resume or stop one of them.
  rpc controlBackgroundDelegation(BackgroundDelegationControl) returns (Boolean);

  // The agents this session can hand work to, for autocomplete and pickers.
  rpc listAgents(EmptyRequest) returns (AgentListResponse);

  // Get available slash commands for autocomplete (used by CLI)
  rpc getAvailableSlashCommands(EmptyRequest) returns (SlashCommandsResponse);
}

// Slash command definition for autocomplete
message SlashCommandInfo {
  string name = 1; // Command name without slash, e.g., "newtask", "smol"
  string description = 2; // Human-readable description
  string section = 3; // "default", "custom", or "cli"
  bool cli_compatible = 4; // false for VS Code-only commands
}

// Response containing all available slash commands
message SlashCommandsResponse {
  repeated SlashCommandInfo commands = 1;
}

// A task handed to one configured agent.
message DelegateRequest {
  string agent_name = 1;
  string prompt = 2;
}

// What the delegated agent reported back.
message DelegateResponse {
  string agent_name = 1;
  string text = 2;
  int32 iterations = 3;
  int64 duration_ms = 4;
}

// One configured agent, as a picker needs to show it.
message AgentSummary {
  string name = 1;
  string description = 2;
  string tool_name = 3;
  string runs_on = 4; // profile or model, when the agent names one
}

message AgentListResponse {
  repeated AgentSummary agents = 1;
}

// A delegation the user started and left running.
message BackgroundDelegation {
  string id = 1;
  string agent_name = 2;
  string prompt = 3;
  // "running", "paused", "completed", "failed" or "stopped".
  string status = 4;
  int64 started_at = 5;
  int64 ended_at = 6;
  // The last thing worth putting on a one-line row, when there is one.
  string activity = 7;
  string error = 8;
}

message BackgroundDelegationList {
  repeated BackgroundDelegation runs = 1;
}

message BackgroundDelegationControl {
  string id = 1;
  // "pause", "resume" or "stop".
  string action = 2;
}
