syntax = "proto3";

package cline;

import "cline/common.proto";
import "cline/state.proto";

option go_package = "github.com/cline/grpc-go/cline";
option java_multiple_files = true;
option java_package = "bot.cline.proto";

service TaskService {
  // Cancels the currently running task
  rpc cancelTask(EmptyRequest) returns (Empty);
  // Cancels a queued prompt by ID
  rpc cancelQueuedPrompt(StringRequest) returns (Empty);
  // Cancels the currently running background command
  rpc cancelBackgroundCommand(EmptyRequest) returns (Empty);
  // Stop one running sub-agent, named by the id its spawn tool announced.
  //
  // Separate from cancelTask because that is the only control there was: a
  // fan-out of five where one agent grinds has four finished reports, and
  // cancelling the session throws them away along with the lead's context.
  rpc cancelSubagent(StringRequest) returns (Empty);
  // Abandon one running sub-agent's current attempt and start it again from
  // its task, in the same place in its round -- for an agent stuck on a stream
  // the server dropped, or looping. Stop loses the task; this keeps it.
  rpc restartSubagent(StringRequest) returns (Empty);
  // Detaches the running foreground terminal command ("Proceed While Running"):
  // the agent receives the partial output and a log file path for the rest.
  rpc proceedWhileRunningCommand(EmptyRequest) returns (Empty);
  // Clears the current task
  rpc clearTask(EmptyRequest) returns (Empty);
  // Gets the total size of all tasks
  rpc getTotalTasksSize(EmptyRequest) returns (Int64);
  // Measures one task's footprint on disk now: its session directory
  // (transcript, sub-agent transcripts, compaction state, agent overlays) and
  // the checkpoints it holds in the workspace. Refreshes the cached size the
  // history list shows, which is otherwise measured once and never again.
  rpc getTaskSizeOnDisk(StringRequest) returns (TaskSizeOnDisk);
  // Deletes multiple tasks with the given IDs
  rpc deleteTasksWithIds(StringArrayRequest) returns (Empty);
  // Creates a new task with the given text and optional images
  rpc newTask(NewTaskRequest) returns (String);
  // Shows a task with the specified ID
  rpc showTaskWithId(StringRequest) returns (TaskResponse);
  // Opens the on-disk session directory (messages json, logs) for the task with the given ID
  rpc exportTaskWithId(StringRequest) returns (Empty);
  // Toggles the favorite status of a task
  rpc toggleTaskFavorite(TaskFavoriteRequest) returns (Empty);
  // Replaces the tags on a task (an empty list removes them all)
  rpc setTaskTags(SetTaskTagsRequest) returns (Empty);
  // Gets filtered task history
  rpc getTaskHistory(GetTaskHistoryRequest) returns (TaskHistoryArray);
  // Sends a response to a previous ask operation
  rpc askResponse(AskResponseRequest) returns (Empty);
  // Edits a previous user message, truncates following conversation, and regenerates
  rpc editMessageAndRegenerate(EditMessageAndRegenerateRequest) returns (Empty);
  // Records task feedback (thumbs up/down)
  rpc taskFeedback(StringRequest) returns (Empty);
  // Executes a quick win task with command and title
  rpc executeQuickWin(ExecuteQuickWinRequest) returns (Empty);
  // Deletes all task history
  rpc deleteAllTaskHistory(EmptyRequest) returns (DeleteAllTaskHistoryCount);
}

// One task's footprint on disk, split by what wrote it.
message TaskSizeOnDisk {
  // Everything under the session directory, in bytes.
  int64 total_bytes = 1;
  // The lead's own transcript, manifest and compaction state.
  int64 session_bytes = 2;
  // Transcripts of the delegated agents the session ran.
  int64 agent_transcript_bytes = 3;
  // Delegated agents' overlays: their private copies of workspace files.
  int64 overlay_bytes = 4;
  // Checkpoints this session holds as git refs in the workspace. Their
  // objects are shared with the repository, so they have a count, not a size.
  int32 checkpoint_count = 5;
  // False when the task has no session directory to measure (a legacy task,
  // or one that was never persisted).
  bool measured = 6;
}

// Request message for creating a new task
message NewTaskRequest {
  Metadata metadata = 1;
  string text = 2;
  repeated string images = 3;
  repeated string files = 4;
  optional Settings task_settings = 5;
}

// Request message for toggling task favorite status
message TaskFavoriteRequest {
  Metadata metadata = 1;
  string task_id = 2;
  bool is_favorited = 3;
}

// Request message for replacing a task's tags
message SetTaskTagsRequest {
  Metadata metadata = 1;
  string task_id = 2;
  repeated string tags = 3;
}

// Response for task details
message TaskResponse {
  string id = 1;
  string task = 2;
  int64 ts = 3;
  bool is_favorited = 4;
  int64 size = 5;
  double total_cost = 6;
  int32 tokens_in = 7;
  int32 tokens_out = 8;
  int32 cache_writes = 9;
  int32 cache_reads = 10;
  string model_id = 11;
  bool is_legacy = 12;
}

// Request for getting task history with filtering
message GetTaskHistoryRequest {
  Metadata metadata = 1;
  bool favorites_only = 2;
  string search_query = 3;
  string sort_by = 4;
  bool current_workspace_only = 5;
  int32 limit = 6;
  int32 offset = 7;
  // Only tasks carrying these tags. Empty filters nothing.
  repeated string tags = 8;
  // Require every tag rather than any one of them.
  bool tags_match_all = 9;
}

// Response for task history
message TaskHistoryArray {
  repeated TaskItem tasks = 1;
  bool has_more = 2;
}

// Task item details for history list
message TaskItem {
  string id = 1;
  string task = 2;
  int64 ts = 3;
  bool is_favorited = 4;
  int64 size = 5;
  double total_cost = 6;
  int32 tokens_in = 7;
  int32 tokens_out = 8;
  int32 cache_writes = 9;
  int32 cache_reads = 10;
  string model_id = 11;
  bool is_legacy = 12;
  // Provider id the task ran on. Empty for tasks recorded before this
  // field existed and for legacy imports; consumers show cost in that case.
  string api_provider = 13;
  // What the session ran with, already rendered for display. Empty for
  // sessions recorded before the snapshot existed.
  repeated TaskSettingRow settings = 14;
  // Labels the user gave the task.
  repeated string tags = 15;
}

// One line of the history list's hover card.
message TaskSettingRow {
  string label = 1;
  string value = 2;
}

// Request for ask response operation
message AskResponseRequest {
  Metadata metadata = 1;
  string response_type = 2;
  string text = 3;
  repeated string images = 4;
  repeated string files = 5;
}

// Request for editing a past user message and regenerating the conversation after it
message EditMessageAndRegenerateRequest {
  Metadata metadata = 1;
  int64 message_ts = 2;
  string text = 3;
  repeated string images = 4;
  repeated string files = 5;
  bool restore_workspace = 6;
}

// Request for executing a quick win task
message ExecuteQuickWinRequest {
  Metadata metadata = 1;
  string command = 2;
  string title = 3;
}

// Results returned when deleting all task history
message DeleteAllTaskHistoryCount {
  int32 tasks_deleted = 1;
}
