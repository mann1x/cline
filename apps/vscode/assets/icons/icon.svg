<?xml version="1.0" encoding="UTF-8"?>
<!--
  The activity-bar icon.

  VS Code renders a view container's icon as a CSS mask, so only the alpha
  survives: colour, gradients and the brand icon's dark rounded square are all
  thrown away, and what is left is a silhouette themed by the workbench. The bar
  it sits on is a row of monochrome line glyphs, so this is drawn to that idiom:
  a 24px grid, a single stroke weight, round caps and joins, no fills.

  It is the brand mark (assets/icons/icon.png) reduced to what survives at 24px:
  the head with its side vents, the antenna, the brain under the dome, and the
  two eyes. The brain's squiggles and the glass dome's shading do not survive
  that reduction and are deliberately not attempted.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
    <title>Cerebriline</title>
    <g fill="none" stroke="#24292F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="1.9" r="1"/>
        <path d="M12 2.9v1.5"/>
        <rect x="4.4" y="4.4" width="15.2" height="15.2" rx="4.2"/>
        <path d="M4.4 10.6H3.2A1.2 1.2 0 0 0 2 11.8v1.8a1.2 1.2 0 0 0 1.2 1.2h1.2"/>
        <path d="M19.6 10.6h1.2A1.2 1.2 0 0 1 22 11.8v1.8a1.2 1.2 0 0 1-1.2 1.2h-1.2"/>
        <path d="M7.9 10.3c-1.1-.8-.8-2.6.6-3 .2-1.4 1.9-2 2.9-1"/>
        <path d="M16.1 10.3c1.1-.8.8-2.6-.6-3-.2-1.4-1.9-2-2.9-1"/>
        <path d="M12 6.3v4"/>
        <path d="M7.4 10.3h9.2"/>
        <rect x="8.3" y="13" width="2.6" height="4.6" rx="1.3"/>
        <rect x="13.1" y="13" width="2.6" height="4.6" rx="1.3"/>
    </g>
</svg>
