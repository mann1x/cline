# Release the mann1x fork to GitHub Releases.
#
# This exists because the manual release path kept getting the artefact name
# wrong. `vsce package` with no `--out` falls back to
# `<package.json name>-<version>.vsix`, and this fork has never changed
# package.json's `name` from upstream's `claude-dev` — so v4.100.99 through
# v4.100.104 were all published as `claude-dev-<version>.vsix`, under
# upstream's identity, while v4.100.86 and earlier were correctly
# `cline-mann1x-<version>.vsix`. The `gh release create` line in the protocol
# used a glob, so the wrong name uploaded silently.
#
# Here the name is computed once, asserted, and uploaded by exact path. There
# is no glob and no human in the naming path.
#
# This does NOT publish to the VS Code Marketplace. Upstream Cline is there and
# one of us there is enough; `ext-vscode-publish-stable.yml` is upstream's and
# does not apply.
#
# It DOES publish to Open VSX when `OVSX_PAT` is configured, and skips that step
# in silence when it is not — so the release keeps working on a fork or a clone
# with no token. Open VSX is what VSCodium, Cursor, Windsurf and Gitpod read, so
# a build published there is auto-updated by those editors the ordinary way.
# Stock VS Code does not read Open VSX, which is why the extension also carries
# its own update check (`apps/vscode/src/services/updates/`).

name: Fork Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Existing tag to release (e.g. v4.100.105)"
                required: true
                type: string

# The artefact name for this fork. Changing this breaks every install
# instruction that names the file, so change it deliberately or not at all.
#
# Changed 2026-09-14: the fork's extension identity became `mann1x.cerebriline`,
# so this is now `cerebriline` and it equals package.json's `name` -- which is
# also what vsce would pick with no `--out`. Declaring it anyway, and asserting
# the two agree, is the point: it is the drift between them that published five
# releases under upstream's `claude-dev` identity.
env:
    ARTIFACT_PREFIX: cerebriline

permissions:
    contents: write

jobs:
    release:
        name: Build and release the VSIX
        runs-on: ubuntu-latest

        steps:
            - name: Resolve the tag
              id: tag
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                    TAG="${{ github.event.inputs.tag }}"
                  else
                    TAG="${GITHUB_REF#refs/tags/}"
                  fi
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
                    echo "Error: tag '$TAG' must match vX.Y.Z (optionally with -suffix or .suffix)"
                    exit 1
                  fi
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "Releasing $TAG"

            - uses: actions/checkout@v4
              with:
                  ref: refs/tags/${{ steps.tag.outputs.tag }}
                  fetch-depth: 0
                  lfs: true

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            # Node 22 specifically: newer LTS (Node 24 / npm 11) makes vsce's
            # `npm list` detection fail with ELSPROBLEMS during packaging.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install workspace dependencies
              run: bun install --frozen-lockfile

            # @cline/* are workspace symlinks to source packages. Without this the
            # build is green while the .vsix carries a stale dist/ — the extension
            # bundles core FROM dist, not from source.
            - name: Build SDK packages
              run: bun run build:sdk

            - name: Assert better-sqlite3 native binary present
              working-directory: apps/vscode
              run: |
                  NODE_FILE="node_modules/better-sqlite3/build/Release/better_sqlite3.node"
                  if [ ! -f "$NODE_FILE" ]; then
                    echo "ERROR: better-sqlite3 native binary missing at apps/vscode/$NODE_FILE"
                    echo "(bun trustedDependencies postinstall likely did not run)"
                    exit 1
                  fi
                  echo "Found better-sqlite3 native binary: $NODE_FILE"

            - name: Install vsce
              run: npm install -g @vscode/vsce

            - name: Resolve version and assert it matches the tag
              id: version
              working-directory: apps/vscode
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="${{ steps.tag.outputs.tag }}"
                  if [[ "$TAG" != "v$VERSION" ]]; then
                    echo "Error: tag '$TAG' does not match apps/vscode/package.json version 'v$VERSION'"
                    echo "Bump the version and commit it before tagging."
                    exit 1
                  fi
                  NAME=$(node -p "require('./package.json').name")
                  if [[ "$NAME" != "$ARTIFACT_PREFIX" ]]; then
                    echo "Error: package.json name '$NAME' does not match ARTIFACT_PREFIX '$ARTIFACT_PREFIX'."
                    echo "The extension's identity moved without the release name following it."
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "artifact=${ARTIFACT_PREFIX}-${VERSION}.vsix" >> "$GITHUB_OUTPUT"
                  echo "Tag and package version agree: $TAG"

            # The listing's Changelog tab renders CHANGELOG.md from inside the
            # .vsix, and the .vsix is packaged below — before the GitHub release
            # for this tag exists. So this release's notes are resolved locally
            # (release-notes/<version>.md, else the annotated tag message), baked
            # into the changelog, and emitted for the release body further down.
            # One text feeds both. No notes means no release: the script exits
            # non-zero rather than shipping a version with a blank entry.
            - name: Resolve release notes and rebuild the changelog
              run: |
                  node apps/vscode/scripts/generate-fork-changelog.mjs \
                    --repo "${{ github.repository }}" \
                    --pending-version "${{ steps.version.outputs.version }}" \
                    --emit-notes "${{ runner.temp }}/release-body.md"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # `package` is build:sdk && check-types && build:webview && lint &&
            # esbuild. It builds only — it does not produce a .vsix.
            - name: Build the extension
              working-directory: apps/vscode
              run: bun run package

            # --no-dependencies: the extension is fully esbuild-bundled, and under
            # the bun workspace the @cline/* deps are symlinks pointing outside the
            # package, so without this vsce walks them and pulls the whole monorepo
            # into the .vsix.
            - name: Package the VSIX under the fork's name
              working-directory: apps/vscode
              run: |
                  # vsce reads README.md from the extension root and has no flag
                  # to point it elsewhere. apps/vscode/README.md is an empty
                  # upstream placeholder, so without this swap the Overview tab
                  # ships blank — which is what every release up to 4.100.116 did.
                  node scripts/marketplace-readme.mjs swap-in
                  trap 'node scripts/marketplace-readme.mjs restore' EXIT

                  vsce package --no-dependencies --allow-package-secrets sendgrid \
                    --out "${{ steps.version.outputs.artifact }}"

            - name: Assert the artefact exists under exactly the expected name
              working-directory: apps/vscode
              run: |
                  ARTIFACT="${{ steps.version.outputs.artifact }}"
                  if [ ! -f "$ARTIFACT" ]; then
                    echo "ERROR: expected artefact '$ARTIFACT' was not produced."
                    echo "What is actually here:"
                    ls -l ./*.vsix 2>/dev/null || echo "  (no .vsix at all)"
                    exit 1
                  fi
                  # A stray upstream-named build alongside ours means --out was
                  # ignored or a previous step produced one; refuse rather than
                  # let a glob pick the wrong file later.
                  STRAYS=$(ls ./*.vsix | grep -v -F "$ARTIFACT" || true)
                  if [ -n "$STRAYS" ]; then
                    echo "ERROR: unexpected extra .vsix files present:"
                    echo "$STRAYS"
                    exit 1
                  fi
                  echo "Artefact: $ARTIFACT ($(stat -c%s "$ARTIFACT") bytes)"
                  sha256sum "$ARTIFACT"

            # Shipped with the release because it is the thing a user needs at
            # exactly the moment they are installing this: the upgrade path from
            # the old `saoudrizwan.claude-dev` identity. Telling someone to go
            # and find a script in the repo, at the point where their old
            # extension is still installed beside the new one, is where an
            # upgrade gets abandoned half-done.
            - name: Assert the migration script is present
              run: |
                  SCRIPT="tools/Migrate-ToCerebriline.ps1"
                  if [ ! -f "$SCRIPT" ]; then
                    echo "ERROR: $SCRIPT is missing; the release would ship without an upgrade path."
                    exit 1
                  fi
                  # PowerShell reads a BOM-less UTF-8 file as ASCII on Windows
                  # PowerShell 5.1, which mangles any non-ASCII character in it.
                  if [ "$(head -c 3 "$SCRIPT" | xxd -p)" != "efbbbf" ]; then
                    echo "ERROR: $SCRIPT has lost its UTF-8 BOM; PowerShell 5.1 will misread it."
                    exit 1
                  fi
                  echo "Migration script: $(stat -c%s "$SCRIPT") bytes"
                  sha256sum "$SCRIPT"

            - name: Publish to Open VSX
              # Never fails the release. The GitHub release is the artefact of
              # record and the extension's own updater reads it; Open VSX is a
              # convenience for the editors that use it as their gallery, and a
              # gallery outage must not lose us a tag that is already pushed.
              continue-on-error: true
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
              run: |
                  # Guarded in the shell, not in `if:`. A step's own `env` is not
                  # in scope for its `if` expression, so `if: env.OVSX_PAT != ''`
                  # is always false and the step would silently never run.
                  if [ -z "$OVSX_PAT" ]; then
                    echo "OVSX_PAT is not configured - skipping Open VSX. The GitHub release is unaffected."
                    exit 0
                  fi
                  # The `mann1x` namespace was created on 2026-09-14 and the
                  # token owns it. If it ever has to be recreated:
                  #   OVSX_PAT=<token> npx ovsx create-namespace mann1x
                  npx --yes ovsx publish "apps/vscode/${{ steps.version.outputs.artifact }}" -p "$OVSX_PAT"

            - name: Create the GitHub release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.tag.outputs.tag }}
                  name: ${{ steps.tag.outputs.tag }}
                  # Exact paths, never a glob: a glob is what let the wrongly-named
                  # artefact upload silently in the first place.
                  files: |
                      apps/vscode/${{ steps.version.outputs.artifact }}
                      tools/Migrate-ToCerebriline.ps1
                  fail_on_unmatched_files: true
                  # The same text baked into the changelog above, so the release
                  # page and the listing's Changelog tab cannot diverge.
                  body_path: ${{ runner.temp }}/release-body.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
