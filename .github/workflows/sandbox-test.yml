name: sandbox-test

# Builds and tests the `cerebriline-sandbox` launcher on every platform whose
# backend it carries: Linux (L1 userns+overlayfs, L2 ptrace), macOS (M1 APFS
# clonefile), Windows (W1 Detours injection). Neither the macOS nor the Windows
# backend has a local host in development, so the macos-14 and windows-latest legs
# here are the one place their isolation contracts are verified end to end — and
# the recipe those legs run is exactly how the release binaries are built. The
# project rule is that a backend does not ship unverified, so this gates it.

on:
    push:
        branches:
            - main
        paths:
            - "sandbox/cerebriline-sandbox/**"
            - ".github/workflows/sandbox-test.yml"
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - "sandbox/cerebriline-sandbox/**"
            - ".github/workflows/sandbox-test.yml"
    workflow_call:

permissions:
    contents: read

defaults:
    run:
        working-directory: sandbox/cerebriline-sandbox

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                include:
                    # L1 (user namespace + overlayfs) and L2 (ptrace) — x86_64.
                    - os: ubuntu-latest
                      backend: linux-l1-l2
                    # M1 (APFS clonefile) — arm64 Apple Silicon. macos-14 is the
                    # first Apple-Silicon image, so the arm64 backend runs on the
                    # hardware it targets, not under emulation.
                    - os: macos-14
                      backend: macos-m1
        runs-on: ${{ matrix.os }}
        name: Test (${{ matrix.os }}, ${{ matrix.backend }})
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install the Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Format check
              run: cargo fmt --all --check

            - name: Clippy (warnings are errors)
              run: cargo clippy --release --tests -- -D warnings

            - name: Build
              run: cargo build --release

            # GitHub's ubuntu image ships with AppArmor's unprivileged-userns
            # restriction on (kernel default since 24.04): the L1 backend's
            # unshare is permitted but the namespace is then confined and its
            # setgroups/uid_map/gid_map writes are denied, so L1 would only ever
            # skip. Relaxing the sysctl lets L1 actually run and assert in CI.
            # Best-effort: a kernel without the knob is fine — the test skips.
            - name: Allow unprivileged user namespaces (L1)
              if: runner.os == 'Linux'
              run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

            # On ubuntu this exercises L1 + L2; on macos-14 the M1 clonefile
            # backend against the runner's APFS volume. Each integration test
            # skips itself (rather than failing) if its kernel/filesystem
            # prerequisite is absent, so a hardened runner does not produce a
            # spurious red. --no-fail-fast so every backend's test reports even
            # when an earlier one skips or fails.
            - name: Test
              run: cargo test --release --no-fail-fast

    # Windows W1 is a separate job: it must build Microsoft Detours + the C++
    # hook.dll before the Rust launcher can link and the test can inject.
    windows:
        runs-on: windows-latest
        name: Test (windows-latest, windows-w1)
        env:
            DETOURS_LIB_DIR: ${{ github.workspace }}\sandbox\w1-spike\Detours\lib.X64
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install the Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - name: Format check
              run: cargo fmt --all --check

            # Clone + build Microsoft Detours (a /MT static lib) and the C++
            # hook.dll, exactly as a developer would with build.bat — it enters the
            # VS build environment itself, so no extra setup action is needed.
            - name: Build Microsoft Detours + hook.dll
              working-directory: sandbox/w1-spike
              shell: cmd
              run: build.bat

            - name: Clippy (warnings are errors)
              run: cargo clippy --release --tests -- -D warnings

            # Links detours.lib (crt-static, to match Detours' /MT) into the one
            # Rust launcher that replaces sandbox-launch.exe.
            - name: Build the Rust launcher
              run: cargo build --release

            # w1_isolation.rs injects the freshly built hook.dll into a cmd child,
            # redirects its absolute workspace writes into the overlay, and asserts
            # the workspace is untouched. It skips cleanly if injection can't run.
            - name: Test
              env:
                  CEREBRILINE_TEST_HOOK_DLL: ${{ github.workspace }}\sandbox\w1-spike\hook.dll
              run: cargo test --release --no-fail-fast
