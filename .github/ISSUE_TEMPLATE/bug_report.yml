name: 🐛 Bug Report
description: Something in this build is broken
labels: ['bug']
body:
    - type: markdown
      attributes:
          value: |
              This fork exists to run local models well, so a report against a local model is exactly the kind that belongs here — you do not need to reproduce it on a frontier model first.

              The one thing worth checking before filing: whether the newest [release](https://github.com/mann1x/cline/releases) still does it, and whether official Cline does it too. If official Cline does, it belongs [upstream](https://github.com/cline/cline/issues).

    - type: input
      id: version
      attributes:
          label: Build
          description: The version shown in the VS Code extensions list, e.g. `4.99.65`.
          placeholder: '4.99.65'
      validations:
          required: true

    - type: textarea
      id: model
      attributes:
          label: Model and provider
          description: |
              The model id, the provider, and the context size you have configured. For Ollama, the output of `ollama show <model>` is ideal.
          placeholder: |
              Provider: Ollama (http://localhost:11434)
              Model: qwen3-coder:iq4_nl
              Context size setting: 110000
          render: text
      validations:
          required: true

    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What you did, what you expected, and what you got instead. Quote any message Cline showed you verbatim — the exact wording usually identifies the code path.
      validations:
          required: true

    - type: textarea
      id: repro
      attributes:
          label: Steps to reproduce
          description: If it only happens sometimes, say so and describe what it seems to depend on. An intermittent report is still worth filing.
          placeholder: |
              1. Start a task on a large file
              2. Let it run until the context bar is nearly full
              3. …
      validations:
          required: false

    - type: textarea
      id: logs
      attributes:
          label: Logs
          description: |
              The single most useful thing you can attach. In VS Code: **Output** panel → **Cline** in the dropdown.

              If the problem involves long sessions or context, these two are worth attaching as well (Windows paths shown; on macOS and Linux they live in the system temp directory):

              - `%TEMP%\cline-compaction.jsonl` — one line per compaction decision
              - `%TEMP%\ollama-request-logs-*\` — the exact request bodies sent to Ollama

              Redact anything private before pasting. These files can contain your source code.
          render: shell
      validations:
          required: false

    - type: dropdown
      id: os
      attributes:
          label: Operating system
          options:
              - Windows
              - macOS
              - Linux
      validations:
          required: false
